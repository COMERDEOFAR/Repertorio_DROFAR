<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agregar producto - Drofar</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#14243a;line-height:1.5}
h1{font-size:22px;color:#14437C}label{display:block;margin-top:14px;font-weight:700}
input,select,textarea,button{font:inherit;width:100%;padding:9px 12px;border:1.5px solid #dde4ea;border-radius:10px;box-sizing:border-box}
button{background:#14437C;color:#fff;border:0;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}
.o{font-weight:400;color:#5a6678}ol{padding-left:20px}#out{margin-top:18px;padding:12px;background:#f4f7ee;border-radius:10px;display:none}
#prev{max-width:180px;margin-top:8px;display:none;border:1px solid #dde4ea}
a.dl{display:block;margin:6px 0;color:#14437C;font-weight:700}
</style></head><body>
<h1>Agregar un producto al portafolio</h1>
<p>Llena esto, descarga los 2 archivos que salen y súbelos al repositorio de GitHub (la guía dice cómo).</p>
<label>Sección</label><select id="sec"></select>
<label>Categoría</label><select id="cat"></select>
<label>Nombre del producto</label><input id="name" maxlength="80">
<label>Marcas o palabras para buscarlo <span class="o">(opcional, separadas por coma)</span></label><textarea id="kw" rows="2" maxlength="300"></textarea>
<label>Imagen de la página</label><input id="img" type="file" accept="image/*"><img id="prev" alt="">
<button id="go">Preparar archivos</button>
<div id="out"></div>
<script>
var SEC={med:["Medicamentos",[["med","Medicamentos A–Z"],["vit","Vitaminas y suplementos"],["ant","Antisépticos y antihongos"],["gri","Gripa, tos y garganta"],["cre","Cremas tópicas"],["hid","Hidratación"]]],
nat:["Productos naturales",[["dig","Fibra, digestivos y vinagres"],["tos","Tos, garganta y propóleo"],["sue","Sueño y relajantes"],["vit","Vitaminas, minerales y tónicos"],["col","Colágeno y suplementos"],["dep","Deportivos y proteínas"],["beb","Bebidas naturales"],["nut","Nutrición y niños"],["int","Salud íntima y energía"],["ung","Ungüentos y aceites"],["vas","Vaselinas, alcanfor y químicos"]]],
dis:["Dispositivos médicos y otros",[["cur","Insumos y curación"],["pro","Termómetros y protección"],["emb","Embarazo y preservativos"],["pie","Piel e higiene personal"],["cab","Uñas y cabello"],["beb","Bebé"],["jab","Jabones y repelentes"],["ora","Higiene oral"]]]};
var $=function(i){return document.getElementById(i)};
Object.keys(SEC).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=SEC[k][0];$('sec').appendChild(o)});
function cats(){$('cat').innerHTML='';SEC[$('sec').value][1].forEach(function(c){var o=document.createElement('option');o.value=c[0];o.textContent=c[1];$('cat').appendChild(o)})}
$('sec').onchange=cats;cats();
$('img').onchange=function(){var f=this.files[0];if(f){$('prev').src=URL.createObjectURL(f);$('prev').style.display='block'}};
function dl(blob,name){var a=document.createElement('a');a.className='dl';a.href=URL.createObjectURL(blob);a.download=name;a.textContent='⬇ Descargar '+name;$('out').appendChild(a)}
$('go').onclick=function(){
  var name=$('name').value.trim(),f=$('img').files[0];
  if(!name||!f){alert('Falta el nombre o la imagen.');return}
  $('go').disabled=true;$('go').textContent='Preparando…';
  Promise.all([fetch('catalog.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}),createImageBitmap(f,{imageOrientation:'from-image'})]).then(function(r){
    var cat=r[0]||{};cat.v=2;cat.extras=cat.extras||[];cat.removed=cat.removed||[];cat.edits=cat.edits||{};
    var b=r[1],s=Math.min(1,780/b.width,1010/b.height),c=document.createElement('canvas');
    c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    c.toBlob(function(blob){
      var ext=blob.type==='image/webp'?'webp':'jpg';
      var id=Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4);
      var file='x_'+id+'_a.'+ext;
      cat.extras.push({id:id,sec:$('sec').value,name:name,kw:$('kw').value.trim(),cat:$('cat').value,img:'img/'+file,t:Date.now()});
      $('out').style.display='block';
      $('out').innerHTML='<b>Listo.</b> Sube estos 2 archivos a GitHub:<ol><li>La imagen</li><li>catalog.json (reemplaza el que hay)</li></ol>';
      dl(blob,file);dl(new Blob([JSON.stringify(cat,null,1)],{type:'application/json'}),'catalog.json');
      $('go').disabled=false;$('go').textContent='Preparar archivos';
    },'image/webp',0.8);
  }).catch(function(){alert('No pude leer la imagen o el catálogo.');$('go').disabled=false;$('go').textContent='Preparar archivos'});
};
</script></body></html>
